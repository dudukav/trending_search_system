services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      cub kafka-ready -b kafka:29092 1 30 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic search-events --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic search-events-dlq --partitions 1 --replication-factor 1
      "

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: marketplace-search-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  schema-init:
    image: curlimages/curl:8.8.0
    container_name: marketplace-search-init
    depends_on:
      schema-registry:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        curl -fsS -X PUT \
          -H 'Content-Type: application/vnd.schemaregistry.v1+json' \
          --data '{"compatibility":"BACKWARD"}' \
          http://schema-registry:8081/config/search-events-value

        curl -fsS -X POST \
          -H 'Content-Type: application/vnd.schemaregistry.v1+json' \
          --data '{
            "schema": "{\"type\":\"record\",\"name\":\"SearchEvent\",\"namespace\":\"marketplace.search\",\"fields\":[{\"name\":\"event_id\",\"type\":\"string\"},{\"name\":\"query\",\"type\":\"string\"},{\"name\":\"user_id\",\"type\":[\"null\",\"string\"],\"default\":null},{\"name\":\"ip_hash\",\"type\":[\"null\",\"string\"],\"default\":null},{\"name\":\"timestamp\",\"type\":{\"type\":\"long\",\"logicalType\":\"timestamp-millis\"}},{\"name\":\"source\",\"type\":{\"type\":\"enum\",\"name\":\"SearchSource\",\"symbols\":[\"WEB\",\"IOS\",\"ANDROID\",\"UNKNOWN\"]},\"default\":\"UNKNOWN\"}]}"
          }' \
          http://schema-registry:8081/subjects/search-events-value/versions

  app:
    build: .
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-init:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC: "search-events"
      KAFKA_DLQ_TOPIC: "search-events-dlq"
      KAFKA_GROUP_ID: "trending-search-service"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      SCHEMA_SUBJECT: "search-events-value"
      WINDOW_SIZE: "5m"
      BUCKET_SIZE: "1s"
      SNAPSHOT_TOP_SIZE: "1000"
      MAX_LIMIT: "100"
      MAX_PER_IDENTITY: "2"
    ports:
      - "8080:8080"

  producer:
    build: .
    profiles:
      - producer
    depends_on:
      schema-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/producer"]
    environment:
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC: "search-events"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      SCHEMA_SUBJECT: "search-events-value"
      PRODUCER_RATE: "20"
      PRODUCER_COUNT: "0"

  prometheus:
    image: prom/prometheus:v2.53.0
    depends_on:
      - app
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
